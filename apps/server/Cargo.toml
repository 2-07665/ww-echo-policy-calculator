[package]
name = "echo_server"
version = "3.0.0"
edition = "2024"

[dependencies]
echo_app = { path = "../../crates/echo_app" }
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync"] }
serde_json = "1"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
