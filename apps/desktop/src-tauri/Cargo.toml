[package]
name = "echo_calculator_app"
version = "3.0.0"
description = "Rust desktop app layer for Echo Calculator"
edition = "2024"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
echo_app = { path = "../../../crates/echo_app" }
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }
